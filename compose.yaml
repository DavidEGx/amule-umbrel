services:
  amule:
    build:
      context: ./amule/docker
      args:
        AMULE_VERSION: 3.0.1
    image: amule-umbrel:3.0.1
    init: true
    user: "1000:1000"
    environment:
      AMULE_WEB_PASSWORD: ${AMULE_WEB_PASSWORD:-amule}
    volumes:
      - ./local-data/config:/config
      - ./local-data/downloads:/downloads
    ports:
      - "4711:4711/tcp"
      - "4662:4662/tcp"
      - "4672:4672/udp"
    restart: unless-stopped

